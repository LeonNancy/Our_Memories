baseURL = "https://ljkyzr.com/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "我们的旅行与日常"
theme = "gallery"
timeZone = "Asia/Shanghai"
timeout = "120s"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
copyright = "我们的旅行与日常"

[params]
  defaultTheme = "light"
  description = "记录一起去过的地方，以及平凡又珍贵的日子。"

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

[imaging]
  quality = 85
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"
