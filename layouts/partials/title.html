{{ if .Title }}
  <hgroup>
    <h1>{{ .Title }}</h1>
    {{ if and .IsPage (not .Date.IsZero) }}
      <p class="album-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年1月2日" }}</time></p>
    {{ end }}
    {{ with .Params.Description }}
      <p>{{ . | markdownify }}</p>
    {{ end }}
  </hgroup>
{{ end }}
